<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mia's Classroom</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6f3;--card:#fff;--ink:#4b3a46;--muted:#8f7a88;--line:#f6dfe3;
  --pink:#ff9fb2;--pink-soft:#ffe6ec;--pink-ink:#c2456a;
  --mint:#9fe3c9;--mint-soft:#e2f7ee;--mint-ink:#2b8466;
  --peach:#ffcfae;--peach-soft:#fff0e4;--peach-ink:#b65f2a;
  --butter:#fff1a8;--butter-soft:#fffae0;--butter-ink:#8a6d00;
  --lav:#d9ccff;--lav-soft:#f1ecff;--lav-ink:#6a55b8;
  --sky:#cfe6ff;--sky-soft:#eaf4ff;--sky-ink:#3b6ea5;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:92px;
  background:var(--bg) radial-gradient(#ffd9e1 1.2px,transparent 1.6px) 0 0/24px 24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pink-ink)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.stk{display:inline-block;filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 2px 3px rgba(120,60,80,.25))}
.demo{background:var(--lav-soft);color:var(--lav-ink);font-size:13px;padding:7px 0;border-bottom:1.5px dashed var(--lav)}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo button{background:#fff;border:1.5px solid var(--lav);color:var(--lav-ink);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12.5px;font-weight:700}
header.top{position:relative;overflow:hidden;background:linear-gradient(120deg,#ffd3dc 0%,#ffe3d1 55%,#d8f5e8 100%);padding:18px 0 22px;border-radius:0 0 28px 28px;box-shadow:0 4px 18px rgba(255,140,165,.18)}
header.top .ttl{font-family:'Baloo 2',Nunito,sans-serif;font-size:25px;font-weight:800;color:#a8385c;line-height:1.1}
header.top #hdrSub{color:#8c5368;font-weight:700;font-size:14.5px;margin-top:3px}
.deco{position:absolute;font-size:26px;pointer-events:none}
h2{font-family:'Baloo 2',Nunito,sans-serif;font-size:21px;margin:22px 0 10px;font-weight:800;color:#a8385c;display:flex;align-items:center;gap:8px}
h2 .stk{font-size:22px}
h3{font-family:'Baloo 2',Nunito,sans-serif;font-size:17px;margin:0 0 6px;font-weight:800;line-height:1.25}
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 15px;margin-bottom:14px;box-shadow:0 4px 0 #fbe3e8;min-width:0;overflow-wrap:anywhere}
.card.tape::before{content:'';position:absolute;top:-10px;left:50%;width:74px;height:20px;transform:translateX(-50%) rotate(-3deg);background:repeating-linear-gradient(45deg,rgba(255,159,178,.55) 0 7px,rgba(255,255,255,.7) 7px 14px);border-radius:3px}
.card.tape.mint::before{background:repeating-linear-gradient(45deg,rgba(159,227,201,.65) 0 7px,rgba(255,255,255,.7) 7px 14px)}
.card.tape.butter::before{background:repeating-linear-gradient(45deg,rgba(255,224,120,.6) 0 7px,rgba(255,255,255,.7) 7px 14px)}
.corner{position:absolute;right:-6px;top:-12px;font-size:26px;transform:rotate(12deg);pointer-events:none}
.muted{color:var(--muted)}.small{font-size:13.5px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pre{white-space:pre-line}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:800;background:#f6eef1;color:var(--muted);white-space:nowrap}
.b-ok{background:var(--mint-soft);color:var(--mint-ink)}.b-warn{background:var(--butter-soft);color:var(--butter-ink)}.b-bad{background:var(--pink-soft);color:var(--pink-ink)}.b-blue{background:var(--sky-soft);color:var(--sky-ink)}.b-lav{background:var(--lav-soft);color:var(--lav-ink)}
ul.list{margin:0;padding-left:20px}ul.list li{margin:3px 0}
ul.list li::marker{color:var(--pink)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:15px}
.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0;overflow-wrap:anywhere;min-width:0}
.btn{display:inline-block;text-decoration:none;background:linear-gradient(#ffb7c6,#ff9cb1);color:#5b1b31;border:0;border-radius:16px;padding:10px 18px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #ee7d95}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #ee7d95}
.btn.mint{background:linear-gradient(#b5ecd7,#98e0c4);color:#1d5e48;box-shadow:0 3px 0 #6fcaa6}
.btn.ghost{background:#fff;color:var(--pink-ink);border:2px solid var(--pink);box-shadow:0 3px 0 var(--pink-soft)}
.btn.sm{padding:5px 12px;font-size:13.5px;border-radius:12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;flex-wrap:wrap;max-width:100%;background:#fff}
.seg button{border:0;background:#fff;padding:6px 10px;font-size:13.5px;font-weight:800;cursor:pointer;border-right:1.5px solid var(--line);color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--mint);color:#1d5e48}
.seg button.on.w{background:var(--butter);color:#6e5600}.seg button.on.x{background:var(--pink);color:#5b1b31}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;text-decoration:none;color:var(--ink);border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;font-weight:800}
.chip.on{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink)}
.chip.neg.on{background:var(--butter-soft);border-color:#f5d76e;color:var(--butter-ink)}
.chip.sel{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-ink)}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;border:2px solid var(--line);border-radius:14px;padding:8px 11px;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pink)}
textarea{min-height:64px;resize:vertical}
.lbl{font-size:12.5px;color:var(--muted);font-weight:800;margin:9px 0 4px}
.stu{border-top:2px dotted var(--line);padding:12px 0}
.stu:first-of-type{border-top:0}
.bar{display:flex;align-items:center;gap:8px;margin:16px 0 10px}
.bar .d{flex:1;text-align:center;font-weight:800;font-family:'Baloo 2',Nunito,sans-serif;font-size:18px;color:#a8385c}
.navbtn{border:2px solid var(--line);background:#fff;border-radius:14px;width:40px;height:38px;cursor:pointer;font-size:18px;color:var(--pink-ink);font-weight:800}
.clsbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{border-radius:18px;padding:10px 12px;background:var(--pink-soft)}
.tile:nth-child(3n+2){background:var(--mint-soft)}.tile:nth-child(3n){background:var(--butter-soft)}
.tile .v{font-size:23px;font-weight:800;font-family:'Baloo 2',Nunito,sans-serif;line-height:1.15}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tiles.t3 .v{font-size:20px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:6px 6px;border-bottom:1.5px dotted var(--line);vertical-align:middle;overflow-wrap:normal}
th{font-size:12.5px;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap}
td:first-child,th:first-child{white-space:nowrap}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.alert{border-radius:16px;padding:10px 12px;font-size:14.5px;margin-bottom:12px}
.alert.warn{background:var(--butter-soft);color:#6e5600;border:2px dashed #f5d76e}.alert.info{background:var(--sky-soft);color:#2d5582;border:2px dashed var(--sky)}
/* class pill */
.cp{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 9px 1px 6px;font-weight:800;font-size:14px;white-space:nowrap}
/* session row */
.sess{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.time{border-radius:18px;padding:7px 8px;min-width:68px;text-align:center;font-weight:800;font-size:15px;flex:none;line-height:1.15;font-family:'Baloo 2',Nunito,sans-serif}
.time small{display:block;font-weight:700;opacity:.85;font-size:12px;font-family:Nunito,sans-serif}
/* lịch */
.day{margin-bottom:10px}
.dayh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px}
.dayh b{font-family:'Baloo 2',Nunito,sans-serif;font-size:16px}
.dayh.today b{color:var(--pink-ink)}
.sp{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 6px 6px 10px;margin-bottom:6px}
.sp a{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-decoration:none;color:inherit}
.sp .t{font-weight:800;min-width:44px;font-family:'Baloo 2',Nunito,sans-serif}
.ib{border:0;background:var(--pink-soft);border-radius:12px;width:34px;height:32px;cursor:pointer;font-size:15px;flex:none}
.addb{border:2px dashed var(--pink);background:transparent;color:var(--pink-ink);border-radius:12px;padding:2px 10px;font-weight:800;font-size:13px;cursor:pointer}
.empty{text-align:center;padding:22px 10px}
.empty .big{font-size:46px;display:block;margin-bottom:6px}
/* giáo án */
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:2px dotted var(--line);cursor:pointer}
.li:first-child{border-top:0}
.dbub{flex:none;width:54px;text-align:center;border-radius:16px;padding:4px 0;background:var(--sky-soft);color:var(--sky-ink);font-weight:800;line-height:1.15;font-size:13px}
.dbub b{display:block;font-size:16px;font-family:'Baloo 2',Nunito,sans-serif}
.dbub.past{background:#f4eff1;color:var(--muted)}.dbub.today{background:var(--pink);color:#5b1b31}
.edit{background:var(--peach-soft);border-radius:18px;padding:10px 12px;margin:4px 0 10px;cursor:auto}
/* học phí */
table.fee td{padding:7px 6px}
table.fee tr.grp td{padding:12px 4px 5px;border-bottom:2px solid var(--line)}
table.fee tr.r{cursor:pointer}
table.fee tr.r:hover td{background:#fff9fa}
.box{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;border:2px solid var(--pink);color:transparent;font-weight:900;background:#fff}
tr.paid .box{background:var(--mint);border-color:var(--mint);color:#1d5e48}
tr.paid .nm{color:var(--muted)}
.minus{font-size:12px;color:var(--pink-ink);font-weight:800;margin-left:4px}
.prog{display:inline-block;width:54px;height:8px;border-radius:99px;background:#f4e6ea;vertical-align:middle;overflow:hidden;margin-left:4px}
.prog i{display:block;height:100%;background:var(--mint)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);border-radius:22px 22px 0 0;display:flex;justify-content:center;z-index:5;padding:4px 4px env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(255,140,165,.12)}
nav.tabs a{flex:1;max-width:120px;text-align:center;padding:5px 1px 7px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:800;border-radius:16px;margin:2px}
nav.tabs a .i{display:block;font-size:21px;line-height:1.25}
nav.tabs a.on{color:var(--pink-ink);background:var(--pink-soft)}
@media (max-width:480px){nav.tabs{padding-left:2px;padding-right:2px}nav.tabs a{font-size:10.5px;margin:2px 0;padding:5px 0 7px;white-space:nowrap;letter-spacing:-.2px}nav.tabs a .i{font-size:20px}}
/* Lucky Draw */
table.lkt{width:100%;border-collapse:collapse;font-size:14px}
table.lkt th{font-size:12px;color:var(--muted);padding:4px}
table.lkt th small{display:block;font-size:10.5px;font-weight:700;opacity:.7}
table.lkt td{padding:6px 4px;border-bottom:1.5px dotted var(--line)}
table.lkt tr.grp td{padding:12px 2px 5px;border-bottom:2px solid var(--line)}
table.lkt tr[data-lkn]{cursor:pointer}
table.lkt tr[data-lkn]:hover td{background:#fff9fa}
.lkgo{border:0;border-radius:12px;padding:4px 9px;font:900 14px Nunito,sans-serif;cursor:pointer;background:linear-gradient(#ffe27a,#ffc94d);color:#6e4a00;box-shadow:0 2px 0 #e6a800;white-space:nowrap}
.lkbig{font:800 34px 'Baloo 2',Nunito,sans-serif;color:#a8385c;line-height:1.1;margin-top:6px}.lkbig small{font-size:15px;color:var(--muted)}
.lkrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:2px dotted var(--line)}
.lkp{min-width:74px;text-align:center}.lkp.neg{color:var(--pink-ink)}
.chips.lk .chip.on,.lkall .chip:active{background:var(--butter-soft);border-color:#f5d76e;color:#7a5c00}
.lkall{background:#fffbea;border:2px dashed #f5d98a;border-radius:16px;padding:4px 10px 10px;margin:8px 0 4px}
#undoBox{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:10;background:#4b3a46;color:#fff;border-radius:16px;padding:9px 10px 12px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;width:max-content;max-width:calc(100vw - 32px);box-shadow:0 6px 18px rgba(0,0,0,.25);overflow:hidden}
#undoBox[hidden]{display:none}
#undoBox button{border:0;background:var(--pink);color:#5b1b31;border-radius:12px;padding:6px 12px;font-weight:900;cursor:pointer;white-space:nowrap}
#undoBox i{position:absolute;left:0;bottom:0;height:4px;background:var(--mint);width:100%;animation:undoBar 10s linear forwards}
@keyframes undoBar{to{width:0}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:var(--pink-ink);border:2px solid var(--pink);padding:9px 16px;border-radius:16px;font-size:14px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center;box-shadow:0 4px 0 var(--pink-soft)}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(75,58,70,.35);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px 18px 26px;position:relative;max-height:90vh;overflow:auto}
.stlist a{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:2px dotted var(--line);text-decoration:none;color:inherit}
.stlist a:last-child{border-bottom:0}
.clshead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.clshead span.small{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* báo cáo */
.paper{position:relative;background:#fff;max-width:760px;margin:12px auto;padding:30px 34px;border-radius:24px;border:2px solid var(--line);box-shadow:0 6px 0 #fbe3e8;font-size:15px;overflow:hidden}
.paper .head{background:linear-gradient(120deg,#ffd3dc,#ffe3d1 60%,#d8f5e8);border-radius:20px;padding:14px 18px;margin-bottom:14px;position:relative}
.paper .head h1{margin:0;font-family:'Baloo 2',Nunito,sans-serif;font-size:26px;color:#a8385c;line-height:1.1}
.paper h4{font-family:'Baloo 2',Nunito,sans-serif;margin:16px 0 6px;font-size:17px;color:#a8385c}
.paper .who{display:flex;gap:6px 18px;flex-wrap:wrap;margin:2px 0 4px}
.cmt{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start}
.cmt .ic{border-radius:14px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.ed{border:2px dashed transparent;border-radius:12px;padding:4px 8px;white-space:pre-line}
.ed:hover,.ed:focus{border-color:var(--pink);outline:none;background:#fffafb}
.ph{background:var(--butter-soft);color:var(--butter-ink);border-radius:8px;padding:0 6px;font-weight:800}
.sign{display:flex;justify-content:flex-end;margin-top:18px;text-align:center}
@media (max-width:560px){.paper{padding:16px 12px;margin:8px -6px}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px;font-size:12.5px}.cmt{grid-template-columns:1fr;gap:2px}.cmt .ic{justify-self:start;margin-top:8px}.deco.hide-m{display:none}}
@media print{
  body{background:#fff;padding:0}
  .demo,header.top,nav.tabs,.noprint,#toast,.modal{display:none!important}
  .wrap{max-width:none;padding:0}
  .paper{box-shadow:none;margin:0;border:0;max-width:none;padding:0}
  .ed{border:0;padding:0}
  .ph{background:none;color:inherit}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:14mm}
}
/* ===== Lịch dạng trang tính ===== */
.sgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:18px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 #fbe3e8}
.sg{display:grid;grid-template-columns:44px 44px repeat(7,minmax(70px,1fr));min-width:582px;font-size:12.5px;position:relative}
.sg .c{border-right:1px solid #eee;border-bottom:1px solid #f1f1f1;min-height:26px}
.sg .title{grid-column:1/-1;background:#F9CB9C;color:#274E13;font-weight:800;text-align:center;padding:5px;font-size:15px;letter-spacing:.5px}
.sg .hd{text-align:center;font-weight:800;color:#0000FF;padding:3px 2px;border-bottom:1px solid #ddd;background:#fff}
.sg .hd.today{background:var(--pink-soft);color:var(--pink-ink)}
.sg .tm{text-align:center;font-weight:800;font-size:11.5px;line-height:26px;background:#fff;position:sticky;z-index:2}
.sg .tm.s{color:#6AA84F;left:0}.sg .tm.e{color:#FF0000;left:44px;border-right:2px solid #ddd}
.sg .hd.s{position:sticky;left:0;z-index:3;color:#6AA84F}.sg .hd.e{position:sticky;left:44px;z-index:3;color:#FF0000;border-right:2px solid #ddd}
.sg .cell{cursor:cell}
.sg .cell.gap{border-bottom:3px double #e6d3d8}
.sg .cell.drop{background:#ffe6ec!important;outline:2px dashed var(--pink);outline-offset:-2px}
.sg .cell.tcol{background:#fffafb}
.blk{z-index:1;margin:1px 2px;border-radius:6px;padding:2px 3px;text-align:center;font-weight:800;line-height:1.2;cursor:grab;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.blk.lift{transform:scale(1.06);outline:2px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.3);z-index:3;cursor:grabbing}
.zbar{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:8px}
.zb{border:2px solid var(--line);background:#fff;border-radius:12px;width:34px;height:32px;font-weight:900;font-size:18px;line-height:1;cursor:pointer;color:var(--pink-ink)}
.zbar .zl{min-width:44px;text-align:center;font-weight:800;font-size:13px;color:var(--muted)}
.blk .n{font-weight:700;font-size:12px;opacity:.9}
.blk.l0{margin-right:50%}.blk.l1{margin-left:50%}
.blk.moved{outline:3px solid var(--pink);outline-offset:1px}
.dragghost{position:fixed;z-index:20;pointer-events:none;opacity:.85;transform:rotate(-3deg) scale(1.05);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.notes2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.notes2 h4{margin:0 0 6px;color:#0F9D58;font-weight:800;font-size:15px}
@media (max-width:560px){.notes2{grid-template-columns:1fr}}
.todo .td{display:flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1.5px dotted var(--line)}
.todo .td input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:#0F9D58;cursor:pointer}
.todo .td input.tdt{border:0;border-radius:8px;padding:6px 4px;background:transparent;flex:1;min-width:0}
.todo .td input.tdt:focus{background:#fffbea;box-shadow:inset 0 0 0 2px #f5d76e}
.todo .td.done input.tdt{text-decoration:line-through;color:#a99aa3}
.todo .tdx{border:0;background:none;color:#c9a9b6;font-size:18px;cursor:pointer;padding:0 4px;flex:none}
.todo .tdadd{border:0;background:none;color:#0F9D58;font:800 14px Nunito,sans-serif;cursor:pointer;padding:8px 2px 2px}

<script>
'use strict';
let DB = null; // dữ liệu tải từ Google Sheet (getAll)
const TODAY = (d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'))(new Date());
// Cấu hình lớp: dựng từ tab Lop (rebuild)
const CLASS_CFG = {};
const CLS_COLOR = {};
const CLASSES = [];
const EMO = {};
const colOf = c => { const x = CLS_COLOR[c] || { bg: '#ffe6ec', fg: '#b23a60' }; return [x.bg, x.fg]; };
const chipC = (c, sel, href, label) => { const [bg, fg] = colOf(c); return `<a class="chip ${sel ? 'sel' : ''}" href="${href}" style="${sel ? `background:${bg};color:${fg};border-color:${bg}` : `border-color:${bg}`}"><i class="dot" style="background:${bg}"></i>${label || (EMO[c] || '📘') + ' ' + c}</a>`; };
const cp = c => { const [bg, ink] = colOf(c); return `<span class="cp" style="background:${bg};color:${ink}">${EMO[c] || '📘'} ${c}</span>`; };
const POS = ['M01', 'M04', 'M06', 'M11', 'M12', 'M13', 'M14', 'M15', 'M08'];
const NEG = ['M02', 'M03', 'M05', 'M07', 'M09', 'M10'];
const ST_LABEL = { co: 'Có mặt', muon: 'Đi muộn', phep: 'Vắng phép', kp: 'Vắng KP' };
const HW_LABEL = { du: 'Đủ', thieu: 'Thiếu', khong: 'Không làm' };
// Lucky Draw: mỗi tiêu chí +1 điểm/buổi; đủ 50 điểm được bốc thăm 1 lần (bốc xong trừ 50). Chỉ lớp từ 2 bạn trở lên.
const LUCKY = [['dg', '⏰', 'Đúng giờ'], ['bt', '📚', 'Làm bài đầy đủ'], ['game', '🎮', 'Game'], ['tb', '📈', 'Tiến bộ'],
  ['top', '🏆', 'Đúng hết / cao nhất lớp'], ['tv', '🔤', 'Học từ vựng'], ['tc', '🙋', 'Tích cực tập trung'], ['ns', '✍️', 'Làm bài nghiêm túc']];
const LUCKY_GOAL = 50;
const nrm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().replace(/\s+/g, ' ').trim();
const LK_IN = Object.fromEntries(LUCKY.flatMap(([k, , l]) => [[nrm(l), k], [k, k]]));
const lkOut = a => LUCKY.filter(([k]) => (a || []).includes(k)).map(x => x[2]).join(', ');

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const baseName = n => String(n).split('(')[0].trim();
const money = n => Math.round(n).toLocaleString('vi-VN') + 'đ';
const kfmt = n => Math.round(n / 1000).toLocaleString('vi-VN') + 'k';
const hash = s => { let h = 7; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; };
const WD = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const WDS = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const pd = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pd(d.getMonth() + 1) + '-' + pd(d.getDate());
const dateOf = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = dateOf(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const mondayOf = iso => addDays(iso, -((dateOf(iso).getDay() + 6) % 7));
const dm = iso => { const [, m, d] = iso.split('-'); return (+d) + '/' + (+m); };
const dmy = iso => { const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; };
const wdName = iso => WD[dateOf(iso).getDay()];
const wdS = iso => WDS[dateOf(iso).getDay()];
const fromDMY = s => { const [d, m, y] = s.split('/').map(Number); return y + '-' + pd(m) + '-' + pd(d); };
const firstLine = s => String(s || '').split('\n').map(x => x.replace(/^[-•\s]+/, '').trim()).filter(Boolean)[0] || '';
const mins = t => { const m = String(t).match(/(\d+):(\d+)\s*(SA|CH)?/); if (!m) return 0; let h = +m[1]; if (m[3] === 'CH' && h < 12) h += 12; return h * 60 + +m[2]; };
const hhmm = m => Math.floor(m / 60) + ':' + pd(m % 60);
let MAU = {}, MAU_LIST = [], SETTINGS = {};
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ---------- Học sinh ----------
const STUDENTS = [];
function relabel() { const c = {}; STUDENTS.forEach(s => c[s.name] = (c[s.name] || 0) + 1); STUDENTS.forEach(s => s.display = c[s.name] > 1 ? s.name + ' · ' + s.cls : s.name); }
// Dựng lại danh sách lớp / học sinh từ ST.classes, ST.students (tab Lop, HocSinh)
const isOff = st => /nghỉ|ngừng|off/i.test(st || '');
function rebuild() {
  CLASSES.length = 0; [CLASS_CFG, EMO, CLS_COLOR].forEach(o => Object.keys(o).forEach(k => delete o[k]));
  ST.classes.filter(c => c.code && !isOff(c.status)).forEach(c => {
    CLASS_CFG[c.code] = { type: c.type, size: +c.size || 10, perWeek: +c.perWeek || 2, book: (ST.cinfo[c.code] || {}).book || c.book || '' };
    CLASSES.push(c.code); EMO[c.code] = c.emo || '📘'; CLS_COLOR[c.code] = { bg: c.bg || '#ffe6ec', fg: c.fg || '#b23a60' }; });
  STUDENTS.length = 0;
  ST.students.filter(x => x.name && !isOff(x.status)).forEach(x => STUDENTS.push({ name: x.name, cls: x.cls, fee: +String(x.fee).replace(/[^\d.]/g, '') || 0, from: x.from || '', added: true }));
  relabel();
}
const studentsOf = cls => STUDENTS.filter(s => s.cls === cls);
const byName = n => STUDENTS.find(s => s.name === n);

// ---------- Điểm ----------
let SCORES = [];
const mkScores = rows => rows.filter(s => s.name && s.date).map(s => {
  const sc = parseFloat(String(s.score).replace(',', '.')), mx = parseFloat(String(s.max).replace(',', '.'));
  let p = parseFloat(String(s.pct).replace('%', '').replace(',', '.'));
  if (isNaN(p) && mx) p = sc / mx * 100;
  return { ...s, iso: s.date, date: dmy(s.date), sc, mx, p: isNaN(p) ? null : p };
});
const TYPE_BADGE = { HW: 'b-blue', XT: 'b-ok', CT: 'b-warn' };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

// ---------- Trạng thái (lưu trên máy; bản thật = các tab trong Google Sheet) ----------
const UIKEY = 'qlh-ui';
let ST, SESS = [];
let MC_MEMO = {}, KNOWN_WEEKS = null; // nhớ kết quả tính học phí; xóa mỗi khi lịch thay đổi
function reindex() { // sắp xếp lịch + tự đếm số buổi trong gói
  MC_MEMO = {}; KNOWN_WEEKS = null;
  SESS = ST.sess.slice().sort((a, b) => a.date.localeCompare(b.date) || a.m - b.m);
  const cnt = {};
  SESS.forEach(s => { const cfg = CLASS_CFG[s.cls]; s.num = null; if (!cfg || cfg.type !== 'goi') return;
    if (s.startNum) cnt[s.cls] = +s.startNum; else if (cnt[s.cls] != null) cnt[s.cls] = cnt[s.cls] % cfg.size + 1; else cnt[s.cls] = 1;
    s.num = cnt[s.cls]; });
}
const TYPE_IN = v => /g[oó]i/i.test(v || '') ? 'goi' : 'thang';
const ST_IN = Object.fromEntries(Object.entries(ST_LABEL).map(([k, v]) => [v.toLowerCase(), k]));
const HW_IN = Object.fromEntries(Object.entries(HW_LABEL).map(([k, v]) => [v.toLowerCase(), k]));
const PAY_IN = v => /đã/i.test(v) ? true : /nghỉ/i.test(v) ? 'off' : /chưa/i.test(v) ? false : undefined;
const PAY_OUT = v => v === true ? 'Đã đóng' : v === false ? 'Chưa đóng' : 'Nghỉ';
const S = v => v == null ? '' : String(v).trim();
function fromServer(D) { // các tab Google Sheet -> ST
  DB = D; const T = D.tables;
  READONLY = D.canEdit === false; document.body.classList.toggle('ro', READONLY);
  ST = { classes: T.Lop.map(r => ({ ...r, code: S(r.code), type: TYPE_IN(r.type) })), students: T.HocSinh.map(r => ({ ...r, name: S(r.name), cls: S(r.cls) })),
    sess: T.Lich.filter(r => r.id && r.date).map(r => ({ id: S(r.id), date: S(r.date), m: mins(r.time), dur: +r.dur || 90, cls: S(r.cls), makeup: !!S(r.makeup), startNum: +r.startNum || null })),
    plan: {}, cinfo: {}, weekNotes: {}, att: {}, paid: {}, full: {}, report: {}, ui: {},
    lucky: (T.LuckyDraw || []).filter(r => r.id && r.name).map(r => ({ id: S(r.id), date: S(r.date), name: S(r.name), kind: S(r.kind) || 'Điều chỉnh', pts: +r.pts || 0, gift: S(r.gift) })) };
  // Bảng giá (tab BangGia): giá 1 giờ kèm 1-1, lưu đủ đồng (180000); gõ tay "180" hay "180 đ" = 180 nghìn
  ST.prices = (T.BangGia || []).filter(r => S(r.level)).map((r, i) => ({ r, i })).sort((a, b) => ((+a.r.ord || 1e4 + a.i) - (+b.r.ord || 1e4 + b.i)))
    .map(({ r }) => { const o = { group: S(r.group), level: S(r.level), hour: qNum(r.hour) }; Object.keys(r).forEach(k => { if (k[0] === '_') o[k] = r[k]; }); return o; });
  try { ST.ui = JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch (e) {}
  ST.classes.forEach(c => ST.cinfo[c.code] = { book: S(c.book), extra: S(c.extra) });
  ST.students.forEach(x => { if (S(x.full)) ST.full[x.name] = S(x.full); });
  T.GiaoAn.filter(r => r.id).sort((a, b) => (+a.ord || 0) - (+b.ord || 0)).forEach(r => (ST.plan[S(r.cls)] = ST.plan[S(r.cls)] || []).push({ id: S(r.id), date: S(r.date), num: S(r.num), lesson: S(r.lesson), content: S(r.content), mat: S(r.mat), hw: S(r.hw), print: S(r.print), note: S(r.note) }));
  T.GhiChuTuan.filter(r => r.mon).forEach(r => ST.weekNotes[S(r.mon)] = { gc: S(r.gc), todo: S(r.todo) });
  T.DiemDanh.filter(r => r.date && r.cls && r.name).forEach(r => { const k = S(r.date) + '|' + S(r.cls); (ST.att[k] = ST.att[k] || { rows: {} }).rows[S(r.name)] = { status: ST_IN[S(r.status).toLowerCase()] || 'co', hw: HW_IN[S(r.hw).toLowerCase()] || '', tpl: S(r.tpl).split(/[,\s]+/).filter(Boolean), note: S(r.note), lucky: S(r.lucky).split(/\s*,\s*/).map(x => LK_IN[nrm(x)]).filter(Boolean) }; });

function regDays(cls, ym) { // các thứ học cố định của lớp (thứ xuất hiện nhiều nhất, bỏ buổi bù)
  const cfg = CLASS_CFG[cls]; const from = addDays(ym + '-01', -42), to = lastDay(ym); const cnt = [0, 0, 0, 0, 0, 0, 0];
  SESS.filter(s => s.cls === cls && !s.makeup && s.date >= from && s.date <= to).forEach(s => cnt[dateOf(s.date).getDay()]++);
  return cnt.map((n, d) => [n, d]).filter(x => x[0]).sort((a, b) => b[0] - a[0]).slice(0, cfg.perWeek || 2).map(x => x[1]).sort();
}
function monthlyCalc(cls, ym) { // tháng = từ ngày 1 đến ngày cuối tháng (kết quả được nhớ tới lần sửa lịch sau)
  const mk = cls + '|' + ym; if (MC_MEMO[mk]) return MC_MEMO[mk];
  const a = ym + '-01', b = lastDay(ym); const all = SESS.filter(s => s.cls === cls); const first = all.length ? all[0].date : null;
  const days = regDays(cls, ym); const known = KNOWN_WEEKS || (KNOWN_WEEKS = new Set(SESS.map(s => mondayOf(s.date))));
  let std = 0, stdK = 0, upto = null;
  for (let d = a; d <= b; d = addDays(d, 1)) if (days.includes(dateOf(d).getDay())) { std++; if (first && d >= first && known.has(mondayOf(d))) { stdK++; upto = d; } }
  const n = all.filter(s => s.date >= a && s.date <= b).length;

}

  const nx = list.find(s => s.date > TODAY); const size = CLASS_CFG[cls].size;
  const cur = done.length ? done[done.length - 1].num : nx ? nx.num - 1 : 0; // chưa học buổi nào: tính theo buổi sắp tới
  return { cur, size, left: size - cur };
}
const packStart = (cls, ym) => (SESS.find(s => s.cls === cls && s.num === 1 && ymOf(s.date) === ym) || {}).date || null;
function chargeOf(st, ym) { // 'yes' = có thu, 'off' = nghỉ, 'none' = tháng không thu
  const cfg = CLASS_CFG[st.cls]; if (!cfg) return 'none';
  const v = payOf(st.name, ym); if (v === 'off') return 'off'; if (v === true || v === false) return 'yes';

// "[ ] việc" = chưa xong · "[x 2026-11-14] việc" = xong ngày đó → gạch ngang, xuống cuối, tự xóa sau 7 ngày. Dòng chữ thường (ghi chú cũ) = việc chưa xong.
const parseTodo = s => String(s || '').split('\n').map(l => {
  let m = /^\s*\[x(?:\s+(\d{4}-\d{2}-\d{2}))?\]\s?(.*)$/i.exec(l); if (m) return { t: m[2].trim(), done: m[1] || TODAY };
  m = /^\s*\[ ?\]\s?(.*)$/.exec(l); if (m) return m[1].trim() ? { t: m[1].trim(), done: '' } : null;
  const t = l.replace(/^\s*[-•☐*]\s*/, '').trim(); return t ? { t, done: '' } : null; }).filter(Boolean);
const sortTodo = L => [...L.filter(x => !x.done), ...L.filter(x => x.done)];

function pruneTodos() { // xóa việc đã xong quá 7 ngày (mọi tuần)
  if (READONLY || !ST) return; const lim = addDays(TODAY, -7); let ch = false;
  Object.entries(ST.weekNotes).forEach(([mon, w]) => { if (!w.todo) return; const L = parseTodo(w.todo); const K = L.filter(x => !x.done || x.done > lim);
    if (K.length !== L.length) { ST.weekNotes[mon] = { ...w, todo: todoText(K) }; ch = true; } });
  if (ch) save();
}
// ⧉ Chép tuần trước: gc = thêm các dòng ghi chú tuần này chưa có · todo = thêm việc CHƯA XONG tuần trước (bỏ trùng). Có Hoàn tác.
function copyWeekNote(mon, f) {
  const pw = ST.weekNotes[addDays(mon, -7)] || {}, w = ST.weekNotes[mon] || {}; const norm = s => s.trim().replace(/\s+/g, ' ').toLowerCase();
  let n = 0, val;
  if (f === 'gc') {
    const cur = w.gc || ''; const have = new Set(cur.split('\n').map(norm).filter(Boolean));
    const add = (pw.gc || '').split('\n').filter(l => l.trim() && !have.has(norm(l)) && (have.add(norm(l)), true)); n = add.length;
    val = !cur.trim() ? (pw.gc || '').replace(/\s+$/, '') : cur.replace(/\s+$/, '') + '\n' + add.join('\n');
  } else {
    const L = parseTodo(w.todo); const have = new Set(L.map(x => norm(x.t)));
    const add = parseTodo(pw.todo).filter(x => !x.done && !have.has(norm(x.t)) && (have.add(norm(x.t)), true)); n = add.length;
    val = todoText([...L, ...add.map(x => ({ t: x.t, done: '' }))]);
  }
  if (!n) { toast(f === 'gc' ? 'Ghi chú tuần trước đã có đủ ở tuần này' : 'Không còn việc chưa xong nào cần chép'); return; }
  withUndo(`Đã chép ${n} ${f === 'gc' ? 'dòng ghi chú' : 'việc chưa xong'} từ tuần trước`, () => { ST.weekNotes[mon] = { ...w, [f]: val }; }, '⧉');
  viewLich(mon);
}
function drawTodo(box, mon) {
  const TD = sortTodo(parseTodo((ST.weekNotes[mon] || {}).todo));
  const put = () => { ST.weekNotes[mon] = { ...(ST.weekNotes[mon] || {}), todo: todoText(TD) }; save(); };
  const draw = focus => {
    box.innerHTML = TD.map((x, i) => `<div class="td${x.done ? ' done' : ''}"><input type="checkbox" class="tdc" data-i="${i}" ${x.done ? 'checked' : ''} aria-label="Xong">

      + `<button class="tdadd" type="button">＋ Thêm việc</button>${TD.some(x => x.done) ? '<div class="small muted" style="margin-top:4px">✓ Việc đã xong tự xóa sau 7 ngày</div>' : ''}`;
    box.querySelectorAll('.tdt').forEach(el => {

        else if (e.key === 'Backspace' && !el.value) { e.preventDefault(); TD.splice(i, 1); put(); draw(Math.max(0, i - 1)); }
      });

    });

      const [x] = TD.splice(+el.dataset.i, 1); if (!x.t.trim()) { draw(); return; }
      x.done = el.checked ? TODAY : '';

    box.querySelector('.tdadd').addEventListener('click', () => { const at = TD.filter(x => !x.done).length; TD.splice(at, 0, { t: '', done: '' }); draw(at); });
    if (focus != null) { const el = box.querySelectorAll('.tdt')[focus]; if (el) el.focus(); }
  };
  draw();
}

const SYL_COLS = [['lesson', 'Bài dạy', 95], ['content', 'Nội dung bài dạy (chi tiết)', 290], ['mat', 'Tài liệu cần chuẩn bị', 170], ['hw', 'Homework', 190], ['print', 'File cần in', 150], ['note', 'Note sau buổi học', 170]];

  const keepOld = oldMode === 'all' ? old : oldMode === 'one' ? old.slice(-1) : [];

  const row = (key, d, l, s) => { const g = l && l.guessed;

    ${SYL_COLS.map(([k, , w]) => `<td style="min-width:${w}px;max-width:${w + (k === 'lesson' ? 25 : 90)}px" class="${g ? 'guess' : ''}"><div class="cc" contenteditable="true" data-f="${k}">${esc(l ? l[k] : '')}</div></td>`).join('')}</tr>`; };
  let h = `<div class="clsbar" style="margin-top:14px">${CLASSES.map(c => chipC(c, c === cls, '#giaoan/' + c)).join('')}</div>`;

  if (focus) { const r = document.getElementById('r-' + focus); if (r) { r.scrollIntoView({ block: 'center' }); r.classList.add('flash'); } }

// Đổi tên gọi: gửi xong các thay đổi đang chờ, rồi nhờ Google đổi tên ở mọi tab cùng lúc (QuanLy.gs → renameStudent)
function renameStu(from, to) {
  if (READONLY) return;
  if (SAVE_T) commit(); syncState('saving'); toast('⏳ Đang đổi tên ' + from + ' → ' + to + '…');
  const t0 = Date.now();
  const go = setInterval(() => {
    if (QUEUE.length || BUSY) { if (Date.now() - t0 > 60000) { clearInterval(go); toast('Chưa lưu được, thử đổi tên lại sau'); } return; }
    clearInterval(go);
    serverCall('renameStudent', [from, to], 'Đã đổi tên ' + from + ' → ' + to + ' ✓', null, () => {
      if (location.hash.startsWith('#hs/')) location.hash = '#hs/' + encodeURIComponent(to); });
  }, 150);
}

// ---- Bảng giá (Quote): chỉ hiện khi bấm nút 📋 Quote. Mỗi dòng lưu giá 1 giờ lớp kèm 1-1, các cột còn lại tự tính ----
const Q_PCT = [100, 75, 65, 55, 50]; // giá mỗi học viên, lớp 1 (kèm 1-1) / 2 / 3 / 4 / 5+ học viên = % giá kèm 1-1
const Q_HOURS = 8 * 1.5;            // 1 tháng = 8 tiết, 1 tiết = 1h30
const QCOLS = ['Kèm 1-1', 'Nhóm 2', 'Nhóm 3', 'Nhóm 4', 'Nhóm 5+'];
const qk = n => Math.round(n / 1000).toLocaleString("vi-VN"); // số nghìn đồng, không kèm chữ k (cho vừa điện thoại)
const qKey = x => x.group + '|' + x.level;
const qHour = (x, j) => x.hour * Q_PCT[j] / 100;            // tính bằng số nguyên → làm tròn đúng như Sheet (172.5k → 173k)
const qMonth = (x, j) => x.hour * Q_PCT[j] * Q_HOURS / 100;
function qNum(v) { // "180 đ" / "180" → 180000 · "2.000.000" → 2000000 · số < 10000 hiểu là nghìn đồng
  if (typeof v === 'number') return v > 0 ? Math.round(v < 10000 ? v * 1000 : v) : '';
  let s = String(v == null ? '' : v).replace(/[^\d.,]/g, ''); if (!s) return '';
  s = /^\d{1,3}([.,]\d{3})+$/.test(s) ? s.replace(/[.,]/g, '') : s.replace(',', '.');
  const n = parseFloat(s); return n > 0 ? Math.round(n < 10000 ? n * 1000 : n) : '';
}
function parseQuote(txt) { // dán từ Sheet (cột cách nhau bằng Tab) hoặc gõ "Nhóm | Cấp độ | Giá 1 giờ"
  const out = [], seen = new Set(); let g = '';
  String(txt || '').split(/\r?\n/).forEach(line => {
    const c = line.split(/\t|\|/).map(x => x.trim());
    const k = c.findIndex((x, j) => j > 0 && /^\d[\d.,\s]*(đ|k|vnđ|vnd)?$/i.test(x)); // ô giá đầu tiên (bỏ qua "5.0+")
    if (k < 1 || !c[k - 1] || !qNum(c[k])) return;
    if (k >= 2) g = c[k - 2] || g; // ô nhóm trống (ô gộp trong Sheet) = cùng nhóm với dòng trên
    const x = { group: g, level: c[k - 1], hour: qNum(c[k]) }; if (seen.has(qKey(x).toLowerCase())) return;
    seen.add(qKey(x).toLowerCase()); out.push(x);
  });
  return out;
}
function quoteCard() {
  const L = ST.prices || []; const ed = QUOTE_EDIT && !READONLY;
  let h = `<div class="card quote" id="quote"><div class="row between wrapf" style="gap:6px"><h3>📋 Bảng giá</h3>
    ${READONLY ? '' : `<div class="row" style="gap:6px"><button class="btn sm ghost" id="qPaste" type="button">📥 Dán bảng giá</button><button class="btn sm ${ed ? 'mint' : 'ghost'}" id="qEd" type="button">${ed ? '✓ Xong' : '✏️ Sửa'}</button></div>`}</div>
    <div class="small muted">Học phí của mỗi học viên (nghìn đồng) · 1 tháng: 8 tiết, 1 tiết: 1h30.${ed ? '' : ' <b>Số to</b> = 1 tháng, <span class="qh">số nhỏ</span> = 1 giờ.'}</div>`;
  if (!ed) {
    if (!L.length) return h + `<div class="small muted" style="margin-top:6px">Chưa có bảng giá. Bấm <b>📥 Dán bảng giá</b> ở trên (hoặc <b>✏️ Sửa → ＋ Thêm dòng</b>).</div></div>`;
    h += `<div class="sylscroll"><table class="quote"><tr><th>Cấp độ</th>${QCOLS.map(c => `<th>${c.replace(' ', '<br>')}</th>`).join('')}</tr>`;
    let g = null;
    L.forEach(x => {
      if (x.group !== g) { g = x.group; h += `<tr class="qg"><td colspan="6">${esc(g)}</td></tr>`; }
      h += `<tr><td class="lv">${esc(x.level)}</td>${Q_PCT.map((_, j) => x.hour ? `<td><b>${qk(qMonth(x, j))}</b><span class="qh">${qk(qHour(x, j))}</span></td>` : '<td class="muted">—</td>').join('')}</tr>`;
    });
    return h + '</table></div></div>';
  }
  const groups = [...new Set(L.map(x => x.group).filter(Boolean))];
  h += `<div class="sylscroll"><table class="quote qe"><tr><th>Nhóm</th><th>Cấp độ</th><th>Giá 1 giờ<br>kèm 1-1</th><th></th></tr>`;
  h += L.map((x, i) => `<tr><td><input type="text" class="qgi" data-i="${i}" value="${esc(x.group)}" list="qgl" placeholder="(không nhóm)"></td>
    <td><input type="text" class="qlv" data-i="${i}" value="${esc(x.level)}"></td>
    <td><input type="number" class="qhr" data-i="${i}" min="0" step="1" inputmode="numeric" value="${x.hour ? x.hour / 1000 : ''}" placeholder="—"><div class="qm" data-i="${i}">${x.hour ? '= ' + kfmt(qMonth(x, 0)) + '/th' : ''}</div></td>
    <td><button class="iconb qdel" data-i="${i}" type="button" title="Xóa dòng">🗑️</button></td></tr>`).join('');
  h += `</table></div><datalist id="qgl">${groups.map(g => `<option value="${esc(g)}">`).join('')}</datalist>
    <div class="row wrapf" style="gap:8px;margin-top:8px"><button class="btn sm ghost" id="qAdd" type="button">＋ Thêm dòng</button></div>
    <div class="small muted" style="margin-top:6px">Chỉ cần gõ giá 1 giờ của lớp kèm 1-1 (nghìn đồng, VD 180). Lớp 2 / 3 / 4 / 5+ học viên tự tính = ${Q_PCT.slice(1).join('% / ')}% giá đó; 1 tháng = giá giờ × ${Q_HOURS} giờ.</div>`;
  return h + '</div>';
}
function bindQuote() {
  const ed = $('#qEd'); if (ed) ed.addEventListener('click', () => { QUOTE_EDIT = !QUOTE_EDIT; viewHocPhi(); });
  const dup = (i, x) => ST.prices.some((y, k) => k !== i && qKey(y).toLowerCase() === qKey(x).toLowerCase());
  const txt = (cls, f, empty) => V.querySelectorAll(cls).forEach(el => el.addEventListener('change', () => {
    const i = +el.dataset.i; const x = ST.prices[i]; if (!x) return; const v = el.value.trim().replace(/\s+/g, ' ');
    if (!v && !empty) { el.value = x[f]; toast('Cấp độ không được để trống'); return; }
    const y = { ...x, [f]: v }; if (dup(i, y)) { el.value = x[f]; toast('Đã có dòng "' + y.level + '"' + (y.group ? ' trong nhóm ' + y.group : '')); return; }
    ST.prices[i] = y; save(); }));
  txt('.qgi', 'group', true); txt('.qlv', 'level', false);
  V.querySelectorAll('.qhr').forEach(el => el.addEventListener('change', () => {
    const i = +el.dataset.i; const x = ST.prices[i]; if (!x) return; const v = Math.round((+el.value || 0) * 1000);
    ST.prices[i] = { ...x, hour: v > 0 ? v : '' }; save();
    const m = V.querySelector(`.qm[data-i="${i}"]`); if (m) m.textContent = v > 0 ? '= ' + kfmt(qMonth(ST.prices[i], 0)) + '/th' : ''; }));
  V.querySelectorAll('.qdel').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i; const x = ST.prices[i]; if (!x) return;
    withUndo('Đã xóa dòng giá ' + x.level, () => { ST.prices = ST.prices.filter((_, k) => k !== i); }); viewHocPhi(); }));
  const add = $('#qAdd'); if (add) add.addEventListener('click', () => {
    const g = ST.prices.length ? ST.prices[ST.prices.length - 1].group : '';
    let n = 'Cấp độ mới', k = 2; while (dup(-1, { group: g, level: n })) n = 'Cấp độ mới ' + k++;
    ST.prices = [...ST.prices, { group: g, level: n, hour: '' }]; save(); viewHocPhi();
    const ins = V.querySelectorAll('.qlv'); const last = ins[ins.length - 1]; if (last) { last.focus(); last.select(); } });

function viewBaoCao(name) {

  const R = ST.report[name] || {}; const from = R.from || ymAdd(CUR_M, -1) + '-01', to = R.to || TODAY;
  const a = attOf(name, from, to); const sc = scoresOf(name, from, to);
  const learned = [...new Set((ST.plan[st.cls] || []).filter(l => l.date && l.date >= from && l.date <= to && l.date <= TODAY && hasPlan(l))
    .map(l => (l.lesson && !/^cont/i.test(l.lesson) ? l.lesson : firstLine(l.content)).split(/\s[–-]\s?Buổi|:/)[0].trim()).filter(Boolean))];

  const posC = freq(a.tpl.filter(t => !NEG.includes(t.code)).map(t => t.code)), negC = freq(a.tpl.filter(t => NEG.includes(t.code)).map(t => t.code));
  const errs = sc.filter(s => s.note).map(s => firstLine(s.note));
  const res = sc.filter(s => s.res).map(s => s.res);
  const sp = c => MAU[c] && MAU[c].parent;
  const dLearn = R.learn ?? (learned.join(' · ') || '(chưa có bài trong kỳ)');
  const dGood = R.good ?? (posC.slice(0, 2).map(sp).filter(Boolean).join(' ') || '…');
  const dWeak = R.weak ?? (negC.length ? sp(negC[0]) : errs.length ? 'Con cần chú ý: ' + errs[0] : '…');
  const dGoal = R.goal ?? (res.length ? res[res.length - 1] : '(Cô ghi mục tiêu kỳ tới)');
  const allP = sc.filter(s => s.p != null).map(s => s.p); const fn = fullName(name);
  let h = `<div class="card noprint" style="margin-top:14px"><div class="row wrapf" style="gap:10px;align-items:flex-end">
    <label style="flex:1 1 160px"><div class="lbl">Học sinh</div><select id="rStu">${CLASSES.map(c => `<optgroup label="${c}">${studentsOf(c).map(s => `<option ${s.name === name ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>
    <label style="flex:1 1 130px"><div class="lbl">Từ ngày</div><input type="date" id="rFrom" value="${from}"></label>
    <label style="flex:1 1 130px"><div class="lbl">Đến ngày</div><input type="date" id="rTo" value="${to}"></label></div>
    <div class="row wrapf" style="gap:10px;margin-top:12px"><button class="btn" id="rPrint" type="button">🖨️ In / Lưu PDF</button><span class="small muted">Chữ trong báo cáo bấm vào sửa trực tiếp được.</span></div></div>`;
  h += `<div class="paper" id="paper"><div class="head"><span class="corner stk" style="right:14px;top:8px;font-size:30px">🌷</span><span class="corner stk" style="right:58px;top:30px;font-size:22px;transform:rotate(-12deg)">⭐</span>
    <h1>Báo cáo học tập</h1><div style="color:#8c5368;font-weight:700">${dmy(from)} – ${dmy(to)}</div></div>
    <div class="who"><div>👧 <b style="font-size:17px">${fn ? esc(fn) : `<span class="ph">${esc(st.name)} (chưa có họ tên đầy đủ)</span>`}</b></div><div>${cp(st.cls)}</div></div>
    <div class="tiles t3" style="margin-top:12px"><div class="tile"><div class="k">🗓️ Đi học</div><div class="v">${a.total ? (a.co + a.muon) + '/' + a.total : '—'}</div><div class="small muted">buổi${a.muon ? ' · ' + a.muon + ' lần muộn' : ''}</div></div>
      <div class="tile"><div class="k">📚 Bài tập về nhà</div><div class="v">${a.hwTotal ? a.du + '/' + a.hwTotal : '—'}</div><div class="small muted">lần làm đủ</div></div>
      <div class="tile"><div class="k">⭐ Điểm trung bình</div><div class="v">${allP.length ? Math.round(avg(allP)) + '%' : '—'}</div><div class="small muted">${allP.length} bài chấm</div></div></div>
    <h4>📖 Kỳ này con đã học</h4><div class="ed" contenteditable="true" data-k="learn">${esc(dLearn)}</div>
    <h4>💬 Nhận xét của cô</h4><div class="cmt">
      <span class="ic" style="background:var(--mint-soft);color:var(--mint-ink)">🌟 Con làm tốt</span><div class="ed" contenteditable="true" data-k="good">${esc(dGood)}</div>
      <span class="ic" style="background:var(--butter-soft);color:var(--butter-ink)">🌱 Cần cố gắng</span><div class="ed" contenteditable="true" data-k="weak">${esc(dWeak)}</div>
      <span class="ic" style="background:var(--pink-soft);color:var(--pink-ink)">🎯 Mục tiêu</span><div class="ed" contenteditable="true" data-k="goal">${esc(dGoal)}</div></div>
    <div class="sign"><div><div class="muted small">Giáo viên</div><div style="height:30px"></div>${SETTINGS['Tên cô (ký báo cáo)'] ? '<b>' + esc(SETTINGS['Tên cô (ký báo cáo)']) + '</b>' : '<span class="ph">[Tên cô – điền ở tab CaiDat]</span>'}</div></div></div>`;
  V.innerHTML = h;
  const upd = (k, v) => { ST.report[name] = { ...(ST.report[name] || {}), [k]: v }; save(); };
  $('#rStu').addEventListener('change', e => location.hash = '#baocao/' + encodeURIComponent(e.target.value));
  $('#rFrom').addEventListener('change', e => { upd('from', e.target.value); viewBaoCao(name); });
  $('#rTo').addEventListener('change', e => { upd('to', e.target.value); viewBaoCao(name); });
  V.querySelectorAll('.ed').forEach(el => el.addEventListener('blur', () => upd(el.dataset.k, el.innerText.trim())));
  $('#rPrint').addEventListener('click', () => window.print());
}

let LAST = '';
function route(keep) {
  if (!ST) return; // dữ liệu chưa tải xong: boot() sẽ tự vẽ đúng màn đang chọn khi có dữ liệu
  const p = location.hash.replace(/^#/, '').split('/').map(decodeURIComponent);
  if (!keep && p[0] !== LAST) window.scrollTo(0, 0);
  LAST = p[0]; pruneTodos();
  if (p[0] === 'lich') viewLich(p[1]);
  else if (p[0] === 'buoi') viewBuoi(p[1], p[2]);
  else if (p[0] === 'giaoan') viewGiaoAn(p[1], p[2]);
  else if (p[0] === 'hs') viewHS(p[1]);
  else if (p[0] === 'hocphi') viewHocPhi();
  else if (p[0] === 'lucky') viewLucky();
  else if (p[0] === 'baocao') viewBaoCao(p[1]);
  else viewHome();
}
window.addEventListener('hashchange', () => route());
$('#sync').addEventListener('click', reload);
boot();
</script>
</body>
</html>
