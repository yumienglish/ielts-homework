<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10-Week IELTS Speaking Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ef; --card:#fff; --ink:#2b2d42; --muted:#6b7080; --faint:#8c909c; --line:#ece3d6;
  --brand:#14866d; --brand-soft:#dff3ee; --accent:#ff8c42; --blue:#2f63d8; --blue-soft:#eef3ff;
  --ok:#1f8a4c; --ok-bg:#e7f7ee; --bad:#d64045; --bad-bg:#fdecec; --wait:#9a6412; --wait-bg:#fff3d6;
  --hint:#fff4cc;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55}
button{font:inherit}
.hero{background:linear-gradient(135deg,#14866d,#2bb39a);color:#fff;padding:24px 16px 44px;text-align:center}
.hero h1{margin:0;font-size:clamp(23px,5vw,34px);font-weight:800}
.hero p{margin:4px auto 0;opacity:.93;font-size:15.5px;max-width:640px}
.pack{display:inline-block;color:#fff;opacity:.92;font-size:14px;font-weight:700;text-decoration:none;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;margin-bottom:8px;cursor:pointer}
.pack:hover{opacity:1;background:rgba(255,255,255,.28)}
main{max-width:880px;margin:-26px auto 0;padding:0 16px 150px}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(60,40,10,.07);padding:20px;margin-bottom:18px;border:1px solid var(--line)}
@media (max-width:520px){.card{padding:16px 14px}}
h2,h3{line-height:1.3}
.card > h2:first-child,.card > h3:first-child{margin-top:0}
.part-title{font-size:22px;color:var(--brand);margin:30px 4px 12px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
code,.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;color:var(--faint);letter-spacing:.2px}

/* buttons */
.btn{font-weight:800;border:none;border-radius:14px;padding:11px 20px;cursor:pointer;background:var(--brand);color:#fff;box-shadow:0 3px 0 #0d5e4c;line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0d5e4c}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:12px}
.btn.orange{background:var(--accent);box-shadow:0 3px 0 #c9661f}
.btn.red{background:var(--bad);box-shadow:0 3px 0 #9e2a2e}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #1f469e}
.btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:none}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{background:none;border:none;color:var(--blue);font-size:14.5px;cursor:pointer;text-decoration:underline;padding:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}

/* who */
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who b{color:var(--brand)}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.field{display:flex;flex-direction:column;gap:3px;flex:1 1 180px}
.field label{font-weight:700;font-size:14.5px}
input[type=text],textarea{font:inherit;padding:9px 12px;border:2px solid #e2d9cb;border-radius:12px;outline:none;background:#fffdf9;width:100%}
input[type=text]:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;min-height:64px;font-size:15.5px}

/* overview */
.weeks{display:grid;gap:12px}
.wk{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit;box-shadow:0 3px 12px rgba(60,40,10,.05);transition:transform .15s}
a.wk:hover{transform:translateY(-2px)}
.wk.now{border:2px solid var(--accent);box-shadow:0 4px 16px rgba(255,140,66,.18)}
.wk.locked{opacity:.6;box-shadow:none;cursor:not-allowed}
.wk .n{background:var(--brand);color:#fff;font-weight:800;border-radius:12px;padding:6px 0;flex:none;text-align:center;width:62px;line-height:1.15}
.wk .n small{display:block;font-size:11.5px;font-weight:700;opacity:.9}
.wk.locked .n{background:#9aa0ad}
.wk .body{flex:1;min-width:0}
.wk .t{font-weight:800;font-size:18px}
.wk .d{color:var(--muted);font-size:14px}
.wk .topics{font-size:14.5px;margin-top:4px}
.wk .topics span{color:var(--muted)}
.tag{display:inline-block;border-radius:999px;padding:0 10px;font-size:12.5px;font-weight:800;vertical-align:middle;margin-left:4px;white-space:nowrap}
.tag.now{background:var(--accent);color:#fff}
.tag.lock{background:#eee8dd;color:var(--muted)}
.tag.late{background:var(--bad-bg);color:var(--bad)}
.tag.done{background:var(--ok-bg);color:var(--ok)}
.prog{height:8px;background:#efe8dc;border-radius:99px;overflow:hidden;margin-top:8px}
.prog > div{height:100%;background:var(--brand);border-radius:99px}
.prog-l{font-size:13px;color:var(--muted);margin-top:2px}

table.tbl{border-collapse:collapse;width:100%;font-size:15px}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.tbl th{background:#f6f1e8;font-weight:800}
.tblwrap{overflow-x:auto}
details.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:12px}
details.box > summary{font-weight:800;cursor:pointer;color:var(--brand);font-size:17px}
details.box[open] > summary{margin-bottom:8px}
ul.tight{margin:6px 0;padding-left:22px}
ul.tight li{margin:3px 0}
.rescue li{font-style:italic}

/* week head */
.whead h1{font-size:clamp(21px,4.6vw,28px);margin:0 0 10px;line-height:1.25}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15.5px}
.kv > div:nth-child(odd){font-weight:800;color:var(--muted)}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv > div:nth-child(odd){margin-top:6px}}

/* groups & questions */
.ghead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ghead .gid{font-family:ui-monospace,Consolas,monospace;font-weight:800;color:var(--faint);font-size:17px}
.ghead h3{margin:0;font-size:19px}
.from{font-size:13.5px;color:var(--muted);font-style:italic;margin:2px 0 6px}
.q{padding:14px 0;border-bottom:1px solid #f1ebe1}
.q:last-child{border-bottom:none}
.qline{display:flex;gap:10px;align-items:baseline}
.qline .qn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--hint);color:var(--muted);font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transform:translateY(-1px)}
.qtext{font-weight:700;font-size:17.5px}
.resq{margin:6px 0 0 36px;font-size:14.5px}
.resq summary{cursor:pointer;color:var(--blue);font-weight:700;list-style:none}
.resq summary::-webkit-details-marker{display:none}
.resq ul{margin:4px 0 0}
.stage .resq{margin-left:0}
.opt{color:var(--muted);font-size:14.5px;padding:3px 0}
.opt .ot{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.opt .ot .txt{flex:1 1 220px}
.opt .bul{font-style:italic;font-size:13px;color:var(--faint);margin-left:0}
.mic{background:#f2ede4;border:none;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--muted);padding:1px 9px;cursor:pointer;white-space:nowrap}
.mic:hover{background:var(--brand-soft);color:var(--brand)}
.mic.has{background:var(--ok-bg);color:var(--ok)}
.subh{font-weight:800;color:var(--muted);font-size:15px;margin:16px 0 4px}
.subh.blue{color:var(--blue)}
.hint{background:var(--hint);border-radius:10px;padding:8px 12px;font-size:15px;margin:8px 0 12px}
.cue{background:var(--blue-soft);border-radius:14px;padding:12px 16px;margin:8px 0}
.cue .ct{font-weight:800;color:var(--blue);font-size:18px}
.cue ul{margin:4px 0 0;padding-left:20px}
.cue .ys{font-style:italic;color:var(--muted);font-size:14.5px;margin-top:4px}
.kw label{font-weight:800;font-size:14.5px;color:var(--muted)}
.kw textarea{min-height:52px}

/* recorder */
.rec{margin-top:8px;background:#faf7f2;border-radius:14px;padding:10px 12px}
.opt .rec{margin:6px 0 8px}
.rec .lim{font-size:13.5px;color:var(--faint)}
.player{display:block;width:100%;max-width:420px;height:40px;margin:6px 0 0}
.done{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800;font-size:15px}
.done .okt{color:var(--ok)}
.chip{display:inline-block;border-radius:999px;padding:0 10px;font-size:12.5px;font-weight:800}
.chip.sent{background:var(--ok-bg);color:var(--ok)}
.chip.new{background:var(--wait-bg);color:var(--wait)}
.recing{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--bad);flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:blink 1s infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
.tm{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.track{position:relative;height:8px;background:#ece5d9;border-radius:99px;margin:6px 0 10px;overflow:hidden;max-width:420px}
.track > div{height:100%;background:var(--bad);width:0}
.track .goal{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45}
.msg{font-size:14.5px;margin-top:6px;color:var(--muted)}
.msg.err{color:var(--bad);font-weight:700}
.cmp{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed #e3dbcd}
.prep{font-weight:800;color:var(--blue)}
.big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue);line-height:1.1}

/* mock */
.mock h3{margin:0 0 4px}
.mpart{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.mpart h4{margin:0 0 4px;font-size:17px}
.stage{background:#fff;border:2px solid var(--brand);border-radius:14px;padding:14px;margin:8px 0}
.stage .qn{font-size:13.5px;font-weight:800;color:var(--muted)}
.stage .qbig{font-size:21px;font-weight:800;line-height:1.35;margin:4px 0 6px}
.marks{font-size:14px;color:var(--muted);margin:6px 0 0;padding-left:20px}
.marks b{color:var(--ink);font-variant-numeric:tabular-nums}
.refl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:600px){.refl{grid-template-columns:1fr}}
.refl label{font-weight:800;font-size:14.5px;color:var(--muted)}

/* send bar */
.sendbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(60,40,10,.08);z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.sendbar .inner{max-width:880px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sb-info{font-size:15px}
.sb-info b{color:var(--brand)}
.status{max-width:880px;margin:6px auto 0;font-size:14.5px;font-weight:700}
.status:empty{display:none}
.status.ok{color:var(--ok)} .status.err{color:var(--bad)} .status.wait{color:var(--wait)}
.lockbox{text-align:center;padding:40px 20px}
.lockbox .big{color:var(--muted)}
</style>
</head>
<body>
<div class="hero">
  <a class="pack" id="homeLink" href="#">🗓 10-Week Plan</a>
  <h1 id="heroTitle">🎙 10-Week IELTS Speaking Plan</h1>
  <p id="heroSub"></p>
</div>
<main id="app"></main>
<div class="sendbar" id="sendbar" hidden>
  <div class="inner">
    <div class="sb-info" id="sbInfo"></div>
    <button class="btn orange" type="button" id="sendBtn">✉ Send to teacher</button>
  </div>
  <div class="status" id="sendStatus"></div>
</div>
<script src="data.js"></script>
<script src="app.js?v=4"></script>
</body>
</html>
