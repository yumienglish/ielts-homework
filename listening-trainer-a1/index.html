<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Trainer A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6ff; --card:#fff; --ink:#2b2d42; --muted:#6b7080; --line:#e3e6f2;
  --brand:#6a3fd1; --brand-dark:#4b2a9c; --brand-soft:#efe9ff; --accent:#ff8c42; --blue:#3a6df0;
  --ok:#1f8a4c; --ok-bg:#e7f7ee; --bad:#d64045; --bad-bg:#fdecec; --wait:#b7791f; --wait-bg:#fff6e0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.6}
.hero{background:linear-gradient(135deg,#6a3fd1,#9b6bff);color:#fff;padding:26px 16px 44px;text-align:center}
.hero h1{margin:0;font-size:clamp(25px,5.5vw,36px);font-weight:800;letter-spacing:.2px}
.hero p{margin:4px 0 0;opacity:.93;font-size:15.5px}
.pack{display:inline-block;color:#fff;opacity:.9;font-size:14px;font-weight:700;text-decoration:none;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;margin-bottom:8px}
.pack:hover{opacity:1;background:rgba(255,255,255,.28)}
main{max-width:880px;margin:-26px auto 0;padding:0 16px 130px}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(30,30,80,.07);padding:20px;margin-bottom:18px;border:1px solid var(--line)}
@media (max-width:520px){.card{padding:16px 14px}}
h2,h3{line-height:1.3}

/* start */
.start h2{margin:0 0 4px;font-size:21px}
.field{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.field label{font-weight:700;font-size:15px}
.field input{font:inherit;padding:10px 12px;border:2px solid #d9dcec;border-radius:12px;outline:none;background:#fcfcff}
.field input:focus{border-color:var(--brand)}
.btn{font:inherit;font-weight:800;border:none;border-radius:14px;padding:12px 22px;cursor:pointer;background:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand-dark)}
.btn.orange{background:var(--accent);box-shadow:0 3px 0 #c9661f}
.btn:disabled{opacity:.6;cursor:default}
.err-msg{color:var(--bad);font-weight:700;font-size:14.5px;min-height:1em}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15.5px}
.who b{color:var(--brand)}
.linkbtn{background:none;border:none;color:var(--blue);font:inherit;font-size:14.5px;cursor:pointer;text-decoration:underline;padding:0}
.closed{text-align:center;color:var(--muted)}

/* exercise head */
.ex-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:2px}
.badge{background:var(--brand);color:#fff;font-weight:800;border-radius:10px;padding:3px 10px;font-size:16px;flex:none}
.ex-head h2{font-size:19px;margin:2px 0 0}
.src{color:var(--muted);font-size:13.5px;font-weight:700;margin:0 0 10px}
.how{color:var(--muted);font-size:14.5px;margin:4px 0 14px;background:#f4f5fb;border-radius:10px;padding:8px 12px}
.how b{color:var(--ink)}

/* audio */
.listen{background:#eef3ff;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.listen .lt{font-weight:800;font-size:15px;color:var(--blue)}
.player{display:block;width:100%;height:40px;margin:6px 0 2px}

/* picture + markers */
.pic{position:relative;margin:4px 0 14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.pic img{display:block;width:100%;height:auto}
.pic.small{max-width:640px;margin-left:auto;margin-right:auto}
.mk{position:absolute;transform:translate(-50%,-50%);font:inherit;font-weight:800;font-size:15px;line-height:1.2;border-radius:999px;padding:3px 10px;min-width:30px;text-align:center;
  background:var(--brand);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
.mk.example{background:#0fb5c9}
button.mk{cursor:pointer;background:#fff;color:var(--brand);border:2.5px dashed var(--brand)}
button.mk.on{background:var(--brand);color:#fff;border-style:solid}
button.mk.ok{background:var(--ok);color:#fff;border:2px solid #fff}
button.mk.bad{background:var(--bad);color:#fff;border:2px solid #fff}
button.mk:disabled{cursor:default}
button.mk .fx{display:block;font-size:12px;font-weight:700;opacity:.95}
@media (max-width:520px){.mk{font-size:12.5px;padding:2px 7px;min-width:24px}}

/* name chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chip{font:inherit;font-weight:800;font-size:16px;border-radius:999px;padding:5px 14px;border:2px solid #d9dcec;background:#fff;color:var(--ink);cursor:pointer}
.chip.sel{border-color:var(--accent);background:#fff1e6;color:#c9661f;box-shadow:0 0 0 3px #ffd9bd}
.chip.used{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand)}
.chip.example{background:#e0f8fb;border-color:#e0f8fb;color:#0b8a99;cursor:default}
.chip:disabled{cursor:default}
.tip{font-size:14px;color:var(--muted);margin:-4px 0 8px;min-height:1.2em}
.tip b{color:#c9661f}

/* blanks */
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:10px 14px}
@media (max-width:520px){.cells{gap:8px 10px}}
.cell{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cell .cn{font-weight:800;color:var(--brand);min-width:24px;text-align:right}
.cell .cn.mk2{background:var(--brand);color:#fff;border-radius:999px;min-width:28px;text-align:center;padding:0 6px}
.cell.ex0 .cn{color:#0b8a99}
.cell.ex0 .exv{font-weight:800;color:#0b8a99;border-bottom:2.5px solid #9fdde5;padding:2px 8px;flex:1}
input.txt{font:inherit;font-weight:700;color:var(--blue);border:none;border-bottom:2.5px solid #b3b8cc;background:#f2f4fa;border-radius:8px 8px 3px 3px;padding:4px 8px;outline:none;min-width:0;margin:2px}
.cell input.txt{flex:1}
input.txt:focus{border-color:var(--brand);background:#f3efff}
input.txt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
input.txt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
input.txt:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.fix{font-size:14px;font-weight:800;color:var(--ok)}
.fix:empty{display:none}
.cell .fix{flex-basis:100%;padding-left:30px;line-height:1.3}

/* numbers bank */
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:800;font-size:22px;color:#0fb5c9;margin:0 0 12px;letter-spacing:.5px}

/* sentence table / form */
.tbl{border:2px solid #b8e05a;border-radius:12px;overflow:hidden}
.tbl .tt{background:#b8e05a;text-align:center;font-weight:800;padding:6px}
.tbl.form{border-color:#cfd3e3}
.tbl.form .tt{background:#f4f5fb;font-size:19px}
.row{display:grid;grid-template-columns:34px 1fr minmax(160px,1.05fr);border-top:1px solid #e9ecd9;align-items:center}
.row:first-of-type{border-top:none}
.row .rn{font-weight:800;color:var(--brand);text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#f1f9dd}
.tbl.form .row .rn{background:#f7f8fc}
.row .rq{padding:8px 10px}
.row .ra{padding:6px 10px;background:#fffbea;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tbl.form .row .ra{background:#fff}
.row .ra input.txt{flex:1;min-width:90px}
.row .ra .exv{font-weight:800;color:#0b8a99;border-bottom:2.5px solid #9fdde5;padding:2px 8px;flex:1}
.row .ra .fix{flex-basis:100%}
.row.ex0 .rn{color:#0b8a99}
@media (max-width:560px){
  .row{grid-template-columns:30px 1fr}
  .row .rq{padding-bottom:2px}
  .row .ra{grid-column:2;background:transparent;padding-top:0}
}

/* feedback */
.fb{display:none;margin-top:10px;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.55}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}

/* summary */
.summary{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:2px solid var(--brand)}
.score{font-size:46px;font-weight:800;color:var(--brand);line-height:1}
.score span{font-size:24px;color:var(--muted)}
.secs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sec{background:#eceef6;border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px}
.sec.full{background:var(--ok-bg);color:var(--ok)}
.status{font-weight:700;font-size:15px;margin-top:4px}
.status.ok{color:var(--ok)} .status.err,.status.warn{color:var(--bad)} .status.sending{color:var(--muted)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:40;backdrop-filter:blur(6px)}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:14px}
.prog{flex:1;min-width:0}
.prog .t{font-size:14px;font-weight:700;color:var(--muted)}
.prog .track{height:10px;background:#e4e6f0;border-radius:99px;overflow:hidden;margin-top:3px}
.prog .fill{height:100%;background:linear-gradient(90deg,#9b6bff,#6a3fd1);width:0;transition:width .3s}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="hero">
  <a class="pack" href="../">← Danh sách bài tập</a>
  <h1>🎧 Listening Trainer A1</h1>
  <p id="weekSub">A1 Movers</p>
</header>

<main>
  <!-- Màn hình nhập tên -->
  <section class="card start" id="start">
    <h2>👋 Chào em!</h2>
    <p style="margin:0;color:var(--muted)">Điền tên và lớp rồi bắt đầu nha. Bài làm tự lưu, xong bấm <b>Nộp bài</b> là cô nhận được. Nhớ đeo tai nghe hoặc bật loa để nghe bài nhé 🎧</p>
    <div class="field"><label for="inName">Họ và tên</label><input id="inName" autocomplete="name" placeholder="VD: Nguyễn Minh Anh"></div>
    <div class="field"><label for="inCls">Lớp</label><input id="inCls" placeholder="VD: Movers 1"></div>
    <div class="err-msg" id="startErr"></div>
    <button class="btn" id="startBtn" type="button">Bắt đầu làm bài →</button>
  </section>

  <div id="work" hidden>
    <div id="summaryBox"></div>
    <div class="card who" id="whoBar"></div>
    <div id="exList"></div>
  </div>
</main>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="prog"><div class="t" id="progT">Đã làm 0/0 câu</div><div class="track"><div class="fill" id="progF"></div></div></div>
    <button class="btn orange" id="submitBtn" type="button">Nộp bài ✔</button>
  </div>
</div>

<script>
/* ============ CẤU HÌNH ============ */
// Tuần đang mở cho học sinh. Mỗi tuần đổi số này (và thêm bài của tuần đó vào WEEKS bên dưới).
const OPEN_WEEK = 1;
// URL Web App của Google Apps Script (dùng chung với các trang BTVN khác)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAom9bBpL0ms0VD7_bz5w691011llkFzttYSjKDyRyMCjLLeUZ4EZGGJLtLMFWuiV4sA/exec';
const UNIT = 'Listening Trainer A1';

/* ============ BÀI TẬP TỪNG TUẦN ============
   Đáp án: nhiều cách viết đúng thì ngăn bằng dấu |   VD: 'funfair|fun fair'
   Khi chấm: không phân biệt hoa/thường, bỏ qua dấu chấm, dấu nháy, gạch nối và khoảng trắng.
   Toạ độ x, y của nhãn trên tranh tính theo % chiều ngang / chiều dọc của tranh. */
const WEEKS = {
  1: {
    sub: 'Tuần 1 · Listening Part 1 & Part 2',
    ex: [
      { id:'1', type:'picWrite', track:'02', src:'Sách trang 4 · Exercise 3',
        title:'Listening for names and descriptions of people',
        how:'Listen to a man and a girl talking about a picture. Write the names.<br>👉 Nghe và viết <b>tên</b> của mỗi người <b>A–E</b> trong tranh. Ví dụ: người đầu bếp tên là <b>Fred</b>.',
        img:'cafe.jpg', example:{label:'Fred', x:32.1, y:27.4},
        marks:[
          {k:'A', x:5.4,  y:65.2, key:'Charlie'},
          {k:'B', x:31.1, y:69,   key:'Alex'},
          {k:'C', x:51.6, y:85.6, key:'Kim'},
          {k:'D', x:85.6, y:61.6, key:'Zoe'},
          {k:'E', x:92.4, y:89.3, key:'Clare|Claire'},
        ]},
      { id:'2', type:'picTag', track:'03', src:'Sách trang 5 · Listening Part 1 (Exam practice)',
        title:'Listen and draw lines',
        how:'👉 Nghe và nối tên với người trong tranh: chạm vào <b>một tên</b>, rồi chạm vào <b>ô ? trên người đó</b>. Chạm lại ô đã gắn tên để gỡ ra. Có 1 tên thừa. Ví dụ: <b>Mary</b> là bạn gái đang ngồi.',
        img:'sports.jpg', names:['Sam', 'Sally', 'Jim', 'Charlie', 'Lily', 'Clare'],
        example:{label:'Mary', x:44.8, y:28.4},
        marks:[
          {k:'m1', x:65.2, y:10.9, key:'Jim'},
          {k:'m2', x:14.9, y:36.6, key:'Charlie'},
          {k:'m3', x:86.9, y:33.1, key:'Clare'},
          {k:'m4', x:50.1, y:50.7, key:''},
          {k:'m5', x:38.4, y:71.7, key:''},
          {k:'m6', x:9.1,  y:74.8, key:'Sam'},
          {k:'m7', x:65,   y:71.7, key:''},
          {k:'m8', x:83.2, y:78.7, key:'Lily'},
        ]},
      { id:'3', type:'list', track:'04', src:'Sách trang 6 · Exercise 1',
        title:'Vocabulary: spelling',
        how:'Listen and write the words.<br>👉 Nghe đánh vần và viết lại từ. Ví dụ: S-W-I-M-S-U-I-T → <b>swimsuit</b>.',
        example:'swimsuit',
        items:['pancake', 'building', 'noodles', 'circus', 'penguin', 'funfair|fun fair', 'snail', 'tractor']},
      { id:'4', type:'list', track:'05', src:'Sách trang 6 · Exercise 2', numeric:true,
        title:'Vocabulary: numbers',
        how:'Listen and write the numbers.<br>👉 Nghe và viết <b>số</b> em nghe được vào từng câu (viết bằng chữ số, VD: 28). Các số đều nằm trong dãy dưới đây.',
        bank:[35, 72, 63, 44, 13, 89, 96, 52, 28, 67, 38, 41],
        items:['28', '67', '13', '44', '96', '35', '52', '89', '63', '38', '72', '41']},
      { id:'5', type:'table', track:'06', src:'Sách trang 6 · Exercise 3',
        title:'Listening for names, words and numbers',
        how:'Look at the sentences. Then listen and write the answers.<br>👉 Đọc các câu trước, rồi nghe và điền vào chỗ trống.',
        img:'hospital.jpg', head:'Visiting hospital',
        example:['The family are visiting …', '', 'Grandpa', '.'],
        rows:[
          ['Fred wants to show photos of the …', '', 'Rainbow', 'ride.'],
          ['Grandpa hurt his …', '', 'back', '.'],
          ['Grandpa is in room number …', '', '45|forty five', '.'],
          ['Fred wants to get some …', '', 'chocolates|chocolate', 'for Grandpa.'],
          ['Dinner time at the hospital is at …', '', '6 o’clock|6.00|6:00|6|six|six o’clock|6 pm', '.'],
        ]},
      { id:'6', type:'table', form:true, track:'07', src:'Sách trang 7 · Listening Part 2 (Exam practice)',
        title:'Listen and write',
        how:'👉 Nghe và viết câu trả lời vào chỗ trống. Ví dụ: Mr <b>Best</b>.',
        img:'homework.jpg', head:'Homework',
        example:['Who is the homework for?', 'Mr', 'Best', ''],
        rows:[
          ['Must write about:', 'A', 'party|birthday party', ''],
          ['Name of story:', 'My', 'birthday', ''],
          ['Write homework in:', '', 'English', 'book'],
          ['Number of words:', '', '300|three hundred', ''],
          ['Day to give homework to teacher:', '', 'Wednesday', ''],
        ]},
    ],
  },
};

const WEEK = WEEKS[OPEN_WEEK];
const STORE_KEY = 'btvn-listening-trainer-a1-w' + OPEN_WEEK;
const TITLE = 'Listening Trainer A1 – Tuần ' + OPEN_WEEK + (WEEK ? ' (Track ' + WEEK.ex.map(e => e.track).join(', ') + ')' : '');

/* ============ TIỆN ÍCH ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const squash = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
const alts = k => String(k || '').split('|').map(x => x.trim()).filter(Boolean);
const firstAlt = k => alts(k)[0] || '';
const check = (ans, key) => alts(key).some(a => squash(a) === squash(ans));
const ia = 'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';

/* ============ TRẠNG THÁI ============ */
const blankState = () => ({name:'', cls:'', t:{}, tag:{}, submitted:false, sent:false, submittedAt:null, startedAt:null, leaves:0});
let S = (() => { try { return Object.assign(blankState(), JSON.parse(localStorage.getItem(STORE_KEY)) || {}); } catch (e) { return blankState(); } })();
if (!S.tag || typeof S.tag !== 'object') S.tag = {};
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
let RES = null;
const selName = {}; // tên đang chọn ở mỗi bài nối tên

/* ============ DỰNG GIAO DIỆN ============ */
const inp = (k, label, extra = '') => `<input class="txt" data-k="${k}" ${ia} ${extra} aria-label="${esc(label)}">`;
const pos = m => `left:${m.x}%;top:${m.y}%`;

function exHtml(e, i){
  let body = '';
  if (e.type === 'picWrite'){
    body = `<div class="pic"><img src="img/${e.img}" alt="" loading="lazy">
        <span class="mk example" style="${pos(e.example)}">${esc(e.example.label)}</span>
        ${e.marks.map(m => `<span class="mk" style="${pos(m)}">${m.k}</span>`).join('')}</div>
      <div class="cells">${e.marks.map(m =>
        `<label class="cell"><span class="cn mk2">${m.k}</span>${inp(e.id + '-' + m.k, 'Người ' + m.k)}<span class="fix" id="fix-${e.id}-${m.k}"></span></label>`).join('')}</div>`;
  } else if (e.type === 'picTag'){
    body = `<div class="chips" id="chips-${e.id}"></div><div class="tip" id="tip-${e.id}"></div>
      <div class="pic" id="pic-${e.id}"><img src="img/${e.img}" alt="" loading="lazy">
        <span class="mk example" style="${pos(e.example)}">${esc(e.example.label)}</span>
        ${e.marks.map(m => `<button type="button" class="mk" data-ex="${e.id}" data-m="${m.k}" style="${pos(m)}">?</button>`).join('')}</div>
      <div class="fb" id="fb-${e.id}"></div>`;
  } else if (e.type === 'list'){
    body = (e.bank ? `<div class="bank">${e.bank.map(n => `<span>${n}</span>`).join('')}</div>` : '') +
      `<div class="cells">${e.example ? `<div class="cell ex0"><span class="cn">0.</span><span class="exv">${esc(e.example)}</span></div>` : ''}
      ${e.items.map((_, j) => `<label class="cell"><span class="cn">${j + 1}.</span>${inp(e.id + '-' + (j + 1), 'Câu ' + (j + 1), e.numeric ? 'inputmode="numeric" maxlength="3"' : '')}<span class="fix" id="fix-${e.id}-${j + 1}"></span></label>`).join('')}</div>`;
  } else if (e.type === 'table'){
    const row = (n, r, isEx) => {
      const [q, pre, key, post] = r, k = e.id + '-' + n;
      const ans = isEx ? `<span class="exv">${esc(key)}</span>` : inp(k, 'Câu ' + n);
      return `<div class="row${isEx ? ' ex0' : ''}"><span class="rn">${isEx ? (e.form ? '' : '0') : n}</span><span class="rq">${esc(q)}</span>
        <span class="ra">${pre ? `<span>${esc(pre)}</span>` : ''}${ans}${post ? `<span>${esc(post)}</span>` : ''}${isEx ? '' : `<span class="fix" id="fix-${k}"></span>`}</span></div>`;
    };
    body = `<div class="pic small"><img src="img/${e.img}" alt="" loading="lazy"></div>
      <div class="tbl${e.form ? ' form' : ''}"><div class="tt">${esc(e.head)}</div>
        ${row(0, e.example, true)}${e.rows.map((r, j) => row(j + 1, r, false)).join('')}</div>`;
  }
  return `<section class="card ex" id="ex${e.id}">
    <div class="ex-head"><span class="badge">Bài ${i + 1}</span><h2>${esc(e.title)}</h2></div>
    <div class="src">${esc(e.src)}</div>
    <div class="listen"><div class="lt">🎧 Track ${e.track}</div><audio class="player" controls preload="none" src="audio/${e.track}.mp3"></audio></div>
    <p class="how">${e.how}</p>
    ${body}
  </section>`;
}

function build(){
  $('#weekSub').textContent = WEEK ? WEEK.sub : 'A1 Movers';
  if (!WEEK){
    $('#exList').innerHTML = '<div class="card closed">Chưa có bài cho tuần này, em quay lại sau nhé!</div>';
    return;
  }
  $('#exList').innerHTML = WEEK.ex.map(exHtml).join('');
  document.querySelectorAll('input.txt').forEach(el => {
    el.value = S.t[el.dataset.k] || '';
    el.addEventListener('input', () => { S.t[el.dataset.k] = el.value; save(); progress(); });
  });
  WEEK.ex.filter(e => e.type === 'picTag').forEach(e => {
    $('#chips-' + e.id).addEventListener('click', ev => {
      const b = ev.target.closest('.chip'); if (!b || S.submitted || b.classList.contains('example')) return;
      selName[e.id] = selName[e.id] === b.dataset.n ? null : b.dataset.n;
      renderTags(e);
    });
    $('#pic-' + e.id).addEventListener('click', ev => {
      const b = ev.target.closest('button.mk'); if (!b || S.submitted) return;
      const k = e.id + '-' + b.dataset.m, n = selName[e.id];
      if (n){
        Object.keys(S.tag).forEach(x => { if (x.startsWith(e.id + '-') && S.tag[x] === n) delete S.tag[x]; });
        S.tag[k] = n; selName[e.id] = null;
      } else if (S.tag[k]) delete S.tag[k];
      else { $('#tip-' + e.id).innerHTML = '👆 Chạm vào một <b>tên</b> ở trên trước nhé.'; return; }
      save(); renderTags(e); progress();
    });
    renderTags(e);
  });
  document.addEventListener('play', ev => document.querySelectorAll('audio').forEach(a => { if (a !== ev.target) a.pause(); }), true);
}

function renderTags(e){
  const used = Object.keys(S.tag).filter(x => x.startsWith(e.id + '-')).map(x => S.tag[x]);
  $('#chips-' + e.id).innerHTML = `<button type="button" class="chip example" disabled>${esc(e.example.label)} ✓</button>` +
    e.names.map(n => `<button type="button" class="chip${selName[e.id] === n ? ' sel' : used.includes(n) ? ' used' : ''}" data-n="${esc(n)}" ${S.submitted ? 'disabled' : ''}>${esc(n)}</button>`).join('');
  $('#tip-' + e.id).innerHTML = S.submitted ? '' : selName[e.id] ? `Giờ chạm vào ô <b>?</b> trên người tên <b>${esc(selName[e.id])}</b>.` : '';
  document.querySelectorAll(`#pic-${e.id} button.mk`).forEach(b => {
    const m = e.marks.find(x => x.k === b.dataset.m), v = S.tag[e.id + '-' + m.k] || '';
    let cls = 'mk', html = v ? esc(v) : '?';
    if (S.submitted){
      const right = m.key ? v === m.key : !v;
      if (v || m.key){
        cls += right ? ' ok' : ' bad';
        if (!right) html = (v ? `<s>${esc(v)}</s>` : '?') + (m.key ? `<span class="fx">→ ${esc(m.key)}</span>` : '');
      }
    } else if (v) cls += ' on';
    b.className = cls; b.innerHTML = html; b.disabled = S.submitted;
  });
}

/* ============ TIẾN ĐỘ ============ */
function answeredList(){
  const a = [];
  document.querySelectorAll('input.txt').forEach(el => a.push(!!(S.t[el.dataset.k] || '').trim()));
  (WEEK ? WEEK.ex : []).filter(e => e.type === 'picTag').forEach(e => {
    const n = Object.keys(S.tag).filter(x => x.startsWith(e.id + '-')).length;
    const need = e.marks.filter(m => m.key).length;
    for (let i = 0; i < need; i++) a.push(i < n);
  });
  return a;
}
function progress(){
  const a = answeredList(), done = a.filter(Boolean).length;
  if (S.submitted && RES){
    $('#progT').textContent = `Đã nộp · ${RES.score}/${RES.total} câu đúng`;
    $('#progF').style.width = (RES.total ? RES.score / RES.total * 100 : 100) + '%';
  } else {
    $('#progT').textContent = `Đã làm ${done}/${a.length} câu`;
    $('#progF').style.width = (a.length ? done / a.length * 100 : 0) + '%';
  }
}

/* ============ CHẤM ĐIỂM ============ */
function grade(){
  const items = [];
  const text = (sec, k, n, q, key) => {
    const ans = (S.t[k] || '').trim();
    items.push({sec, k, n:String(n), q, ans, correct:firstAlt(key), ok:check(ans, key)});
  };
  WEEK.ex.forEach(e => {
    if (e.type === 'picWrite') e.marks.forEach(m => text(e.id, e.id + '-' + m.k, m.k, 'Tên người ' + m.k + ' trong tranh', m.key));
    else if (e.type === 'list') e.items.forEach((key, j) => text(e.id, e.id + '-' + (j + 1), j + 1, (e.numeric ? 'Số câu ' : 'Từ câu ') + (j + 1), key));
    else if (e.type === 'table') e.rows.forEach((r, j) => text(e.id, e.id + '-' + (j + 1), j + 1, [r[0], r[1], '_____', r[3]].filter(Boolean).join(' '), r[2]));
    else if (e.type === 'picTag') e.marks.filter(m => m.key).forEach(m => {
      const where = Object.keys(S.tag).find(x => x.startsWith(e.id + '-') && S.tag[x] === m.key);
      const ans = S.tag[e.id + '-' + m.k] || '';
      items.push({sec:e.id, n:m.key, q:'Nối tên ' + m.key, ans:ans ? 'gắn ' + ans : (where ? 'gắn nhầm chỗ' : '(chưa nối)'), correct:m.key, ok:ans === m.key});
    });
  });
  const sections = WEEK.ex.map((e, i) => {
    const its = items.filter(x => x.sec === e.id);
    return {id:e.id, title:`Bài ${i + 1} · Track ${e.track} · ${e.title}`, score:its.filter(x => x.ok).length, total:its.length, pending:false};
  });
  return {items, sections, score:items.filter(x => x.ok).length, total:items.length};
}

/* ============ HIỂN THỊ KẾT QUẢ ============ */
function showResults(){
  RES = grade();
  RES.items.forEach(i => {
    if (!i.k) return;
    const el = document.querySelector(`input.txt[data-k="${i.k}"]`), fix = $('#fix-' + i.k);
    if (el){ el.disabled = true; el.classList.add(i.ok ? 'ok' : 'bad'); }
    if (fix) fix.textContent = i.ok ? '' : '→ ' + i.correct;
  });
  WEEK.ex.filter(e => e.type === 'picTag').forEach(e => {
    renderTags(e);
    const s = RES.sections.find(x => x.id === e.id), fb = $('#fb-' + e.id);
    fb.className = 'fb show ' + (s.score === s.total ? 'ok' : 'bad');
    fb.innerHTML = s.score === s.total ? '<b>✅ Nối đúng hết rồi!</b>' : `<b>${s.score}/${s.total}</b> · Ô xanh là đúng, ô đỏ là sai (có ghi đáp án →).`;
  });
  document.querySelectorAll('input.txt').forEach(el => el.disabled = true);
  $('#submitBtn').hidden = true;
  renderWho(); renderSummary(); progress();
}
function renderSummary(){
  const pct = RES.total ? RES.score / RES.total : 0;
  $('#summaryBox').innerHTML = `<div class="card summary">
    <div class="score">${RES.score}<span>/${RES.total}</span></div>
    <div style="flex:1;min-width:220px">
      <div style="font-weight:800;font-size:18px">${RES.score === RES.total ? '🎉 Đúng hết luôn, giỏi quá!' : pct >= .8 ? '👏 Giỏi lắm!' : pct >= .5 ? '💪 Khá rồi, cố thêm chút nữa nhé!' : '📚 Xem lại đáp án bên dưới nha!'}</div>
      <div class="secs">${RES.sections.map((s, i) => `<span class="sec${s.score === s.total ? ' full' : ''}">Bài ${i + 1}: ${s.score}/${s.total}</span>`).join('')}</div>
      <div style="font-size:14.5px;color:var(--muted)">Kéo xuống xem đáp án nhé, câu sai tô đỏ.</div>
      <div class="status" id="sendStatus"></div>
    </div></div>`;
  updateStatus();
}

/* ============ GỬI BÀI ============ */
let sendState = null, sendErr = '';
function updateStatus(){
  const el = $('#sendStatus'); if (!el) return;
  const st = S.sent ? 'ok' : sendState;
  el.className = 'status ' + (st || '');
  if (st === 'ok') el.innerHTML = '✅ Cô đã nhận được bài!';
  else if (st === 'sending') el.innerHTML = '⏳ Đang gửi bài cho cô…';
  else if (st === 'warn') el.innerHTML = '⚠️ Trang chưa được cài địa chỉ gửi bài (SCRIPT_URL), nên bài chưa được gửi cho cô.';
  else el.innerHTML = `⚠️ Chưa gửi được bài${sendErr ? ` (${esc(sendErr)})` : ''}. Em kiểm tra mạng rồi bấm: <button class="btn" type="button" id="resendBtn" style="padding:6px 14px;font-size:14px;margin-left:4px">Gửi lại</button>`;
  const rb = $('#resendBtn'); if (rb) rb.onclick = send;
}
function payload(){
  return {
    app:'btvn', unit:UNIT, title:TITLE, name:S.name, cls:S.cls, submittedAt:S.submittedAt,
    startedAt:S.startedAt || null, leaves:S.leaves || 0,
    timeTakenSec:S.startedAt ? Math.max(0, Math.round((new Date(S.submittedAt) - new Date(S.startedAt)) / 1000)) : null,
    score:RES.score, total:RES.total,
    sections:RES.sections.map(s => ({id:s.id, title:s.title, score:s.score, total:s.total, pending:false})),
    items:RES.items.map(i => ({sec:i.sec, n:i.n, q:i.q, ans:i.ans, correct:i.correct, ok:i.ok})),
    wantsAudio:false, audio:null,
  };
}
async function send(){
  if (!SCRIPT_URL || SCRIPT_URL.includes('PASTE_')){ sendState = 'warn'; updateStatus(); return; }
  sendState = 'sending'; updateStatus();
  try {
    const r = await fetch(SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload())});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'máy chủ báo lỗi');
    S.sent = true; save(); sendState = 'ok';
  } catch (err){
    sendState = 'err'; sendErr = err && err.message ? err.message : String(err);
  }
  updateStatus();
}

/* ============ NỘP BÀI ============ */
$('#submitBtn').addEventListener('click', () => {
  if (S.submitted || !WEEK) return;
  const left = answeredList().filter(x => !x).length;
  muteAway = true;
  const go = confirm(left ? `Còn ${left} câu chưa làm.\nEm vẫn nộp luôn hả?\n(Nộp rồi là không sửa được nữa đâu.)` : 'Nộp bài nhé? Nộp rồi là không sửa được nữa đâu.');
  releaseAway();
  if (!go) return;
  document.querySelectorAll('audio').forEach(x => x.pause());
  Object.keys(selName).forEach(k => selName[k] = null);
  S.submitted = true; S.submittedAt = new Date().toISOString(); save();
  showResults();
  window.scrollTo({top:0, behavior:'smooth'});
  send();
});

/* ============ TÊN HỌC SINH ============ */
function renderWho(){
  $('#whoBar').innerHTML = `<span>👤 <b>${esc(S.name)}</b> · Lớp <b>${esc(S.cls)}</b></span>` +
    (S.submitted ? `<span style="color:var(--muted);font-size:14px">Nộp lúc ${new Date(S.submittedAt).toLocaleString('vi-VN')}</span>` : `<button class="linkbtn" type="button" id="editName">Sửa tên / lớp</button>`);
  const b = $('#editName'); if (b) b.onclick = () => { $('#work').hidden = true; $('#bar').hidden = true; $('#start').hidden = false; $('#inName').focus(); };
}
function showWork(){
  $('#start').hidden = true; $('#work').hidden = false; $('#bar').hidden = !WEEK;
  renderWho(); progress();
}
$('#inName').value = S.name; $('#inCls').value = S.cls;
$('#startBtn').addEventListener('click', () => {
  const n = $('#inName').value.trim(), c = $('#inCls').value.trim();
  if (n.length < 2){ $('#startErr').textContent = 'Em hãy nhập họ và tên.'; return; }
  if (!c){ $('#startErr').textContent = 'Em hãy nhập lớp.'; return; }
  $('#startErr').textContent = '';
  S.name = n.slice(0, 80); S.cls = c.slice(0, 30);
  if (!S.startedAt) S.startedAt = new Date().toISOString();
  save();
  showWork(); window.scrollTo({top:0});
});
['inName', 'inCls'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') $('#startBtn').click(); }));

/* ============ ĐẾM SỐ LẦN RỜI TRANG ============ */
let away = false, muteAway = false;
function releaseAway(){ setTimeout(() => { muteAway = false; away = false; }, 800); }
const tracking = () => !!S.startedAt && !S.submitted && !$('#work').hidden;
function goAway(){
  if (muteAway || away || !tracking()) return;
  away = true; S.leaves = (S.leaves || 0) + 1; save();
}
function comeBack(){ if (!document.hidden && document.hasFocus()) away = false; }
document.addEventListener('visibilitychange', () => document.hidden ? goAway() : comeBack());
window.addEventListener('blur', goAway);
window.addEventListener('focus', comeBack);

/* ============ KHỞI ĐỘNG ============ */
build();
if (S.name) showWork();
if (S.submitted && WEEK) showResults();
</script>
</body>
</html>
